[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amlannotator"
version = "0.2.0"
description = "Hierarchical annotation of malignant cells, blast groups, and LSC types in paediatric AML and B-ALL single-cell RNA-seq data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Sina Kanannejad", email = "sina.kanan85@gmail.com"},
]
dependencies = [
    "numpy>=1.21",
    "scikit-learn>=1.0",
    "anndata>=0.8",
    "scanpy>=1.9",
    "scipy>=1.7",
    "joblib>=1.1",
    "huggingface_hub>=0.20",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/sinakane/AMLAnnotator"
Documentation = "https://sinakane.github.io/AMLAnnotator"

[tool.setuptools.packages.find]
include = ["amlannotator*"]

[tool.setuptools.package-data]
amlannotator = ["models/*.joblib", "models/*.npy", "models/*.json"]
